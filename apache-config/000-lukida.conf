<VirtualHost *:80>
    # Server Name
    ServerName lukida.local
    ServerAlias localhost
    
    # Log files
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    
    # Path to Lukida library
    DocumentRoot /var/www/html/libraries/lukida_newlibrary
    
    # Library name from environment
    SetEnvIf Request_URI ".*" LIBRARY=${LIBRARY}
    SetEnvIf Request_URI ".*" MODE=${MODE}
    
    # Directory configuration
    <Directory /var/www/html/libraries/lukida_newlibrary>
        DirectoryIndex index.php
        AllowOverride All
        Require all granted
        
        # URL Rewriting
        RewriteEngine On
        RewriteBase /
        
        # Protect .htaccess files
        RewriteRule ^\.htaccess$ - [F]
        
        # Protect .ini files
        RewriteRule ^.*\.ini$ / [R,L]
        
        # Don't rewrite for real files and directories
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        
        # Exclude robots.txt and favicon.ico
        RewriteCond %{REQUEST_URI} !robots\.txt
        RewriteCond %{REQUEST_URI} !favicon\.ico
        
        # Rewrite everything else to index.php
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>
    
    # Disable directory listing
    <Directory /var/www/html/libraries/lukida_newlibrary>
        Options -Indexes
    </Directory>
    
    # Security headers
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "SAMEORIGIN"
    Header set X-XSS-Protection "1; mode=block"

</VirtualHost>