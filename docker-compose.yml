version: '3.8'

services:
  # MariaDB Database Service (Alpine - optimized for performance)
  mariadb:
    image: mariadb:11-alpine
    container_name: lukida_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_INITIALIZATIOIN_FILES: /docker-entrypoint-initdb.d
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db/mysql_import.sql:/docker-entrypoint-initdb.d/mysql_import.sql:ro
    networks:
      - lukida_network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped
    command: --max-connections=100 --max_allowed_packet=16M

  # Solr Search Service (Alpine - optimized for performance)
  solr:
    image: solr:9-alpine
    container_name: lukida_solr
    ports:
      - "${SOLR_PORT}:8983"
    environment:
      SOLR_JAVA_MEM: -Xms256m -Xmx512m
    volumes:
      - solr_data:/var/solr
      - ./solr-config:/opt/solr-config:ro
    networks:
      - lukida_network
    command: solr-foreground
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/cores"]
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # PHP Apache Application Service
  php-apache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lukida_app
    depends_on:
      mariadb:
        condition: service_healthy
      solr:
        condition: service_healthy
    ports:
      - "${APP_PORT}:80"
    environment:
      # PHP Environment
      PHP_ERROR_LOG: /var/log/php/error.log
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_MAX_POST_SIZE: ${PHP_MAX_POST_SIZE}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE}
      
      # Application Settings
      LIBRARY: ${LIBRARY_NAME}
      MODE: ${APP_MODE}
      
      # Database Connection
      DB_TYPE: ${MARIADB_TYPE}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      DB_NAME: ${MARIADB_DATABASE}
      
      # Solr Connection
      SOLR_HOST: solr
      SOLR_PORT: 8983
    volumes:
      # Lukida application
      - ./lukida:/var/www/html:ro
      
      # Configuration (read-write for development)
      - ./rds-config:/var/www/html/libraries/lukida_newlibrary:rw
      
      # Logs
      - ./logs/apache2:/var/log/apache2:rw
      - ./logs/php:/var/log/php:rw
      - ./logs/lukida:/var/www/html/libraries/lukida_newlibrary/logs:rw
      
      # Apache vhost configuration
      - ./apache-config/000-lukida.conf:/etc/apache2/sites-available/000-lukida.conf:ro
      - ./apache-config/000-lukida.conf:/etc/apache2/sites-enabled/000-lukida.conf:ro
    networks:
      - lukida_network
    restart: unless-stopped

networks:
  lukida_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  solr_data:
    driver: local